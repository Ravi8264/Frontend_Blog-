<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ThinkVista Logo</title>
  <desc id="desc">Compact modern logo with circular dark blue emblem and white typography</desc>

  <defs>
    <style type="text/css">
      <![CDATA[
        .emblem-circle { fill: url(#tvRadial); filter: url(#softShadow); }
        .emblem-mark { stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; }
        .wordmark-bold { font: 700 18px 'Poppins', sans-serif; fill: #FFFFFF; }
        .wordmark-light { font: 400 18px 'Poppins', sans-serif; fill: #FFFFFF; }
      ]]>
    </style>

    <radialGradient id="tvRadial" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(5 5)">
    <circle class="emblem-circle" cx="20" cy="20" r="20"/>
    
    <!-- T Symbol -->
    <path class="emblem-mark" d="M13 17H27M20 17V30"/>
    
    <!-- V Symbol -->
    <path class="emblem-mark" d="M15 25L20 30L25 25" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark Group -->
  <g transform="translate(55 15)">
    <text class="wordmark-bold" x="0" y="20">Think</text>
    <text class="wordmark-light" x="58" y="20">Vista</text>
  </g>
</svg>
